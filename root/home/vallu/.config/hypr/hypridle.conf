# TAKEN FROM THE HYPRLAND WIKI;

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    # after_sleep_cmd = wlr-randr --output eDP-1 --on  # to avoid having to press a key twice to turn on the display
}

# Screen dim
listener {
    timeout = 300                                # 5min
    on-timeout = brightnessctl -s set 1000       # set monitor backlight to minimum, avoid 0 on OLED monitor
    on-resume = brightnessctl -r                 # monitor backlight restore
}

# Keyboard backlight
# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight
listener { 
    timeout = 300                                          # 5min
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight
}

# Actual screen off
listener {
    timeout = 330                                                     # 5.5min
    on-timeout = wlr-randr --output eDP-1 --off
    on-resume = wlr-randr --output eDP-1 --on
}

# Lock session
listener {
    timeout = 360                                 # 6min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

# Suspend
listener {
    timeout = 600                                 # 10min
    on-timeout = systemctl suspend                # suspend pc
}
