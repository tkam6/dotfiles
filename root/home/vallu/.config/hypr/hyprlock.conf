# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(0, 100, 200, 1.0)
    font_size = 35
    font_family = $font

    position = 0, -140
    halign = center
    valign = top
}

# CAPS AND NUM LOCK STATUS
label {
    monitor =
    text = cmd[update:200] /home/vallu/.config/hypr/scripts/caps_num_lock_hyprlock.sh
    font_size = 15
    font_family = $font_ms

    position = 0, 130
    halign = center
    valign = bottom
}

