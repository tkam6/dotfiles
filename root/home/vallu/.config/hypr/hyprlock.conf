# TAKEN FROM THE HYPRLAND WIKI;

# For more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# Rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# Shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#

$font = Inter
$font_time = Inter
$font_ms = Iosevka NFM

general {
    hide_cursor = false
    ignore_empty_input = false
    fail_timeout = 2000
}

auth {
    pam {
        module = hyprlock-gaze-simultaneous
    }
    # Uncomment to enable fingerprint authentication
    # fingerprint {
    #     enabled = true
    #     ready_message = Scan fingerprint to unlock
    #     present_message = Scanning...
    #     retry_delay = 250 # in milliseconds
    # }
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = customBounce, 0.1, 1.57, 0.52, 0.99
    bezier = customBounce2, 0, 1.34, 0.53, 1.03
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    # path = /home/vallu/personal/wallpapers/ennaval/000.webp
    path = screenshot
    blur_passes = 2
}

input-field {
    monitor =
    size = 25%, 5%
    outline_thickness = 0

    font_color = rgba(255, 255, 255, 1.0)
    inner_color = rgba(40, 40, 40, 0.5) # yes fill
    capslock_color = rgba(100, 100, 100, 1.0)
    # For custom dot characters, with swap_font_color set to false
    # check_color = rgba(0, 99, 115, 1.0)
    # fail_color = rgba(180, 0, 0, 1.0)
    check_color = rgba(0, 130, 200, 1.0)
    fail_color = rgba(255, 0, 0, 1.0)

    fade_on_empty = true
    fade_timeout = 5000
    rounding = 30
    swap_font_color = true

    font_family = $font_ms
    placeholder_text = (<i>$USER</i>) <b>ZEUS, YOUR SON HAS RETURNED!</b>
    fail_text = <b>($ATTEMPTS)</b> $FAIL

    # dots_text_format = •
    # dots_size = 0.6
    # dots_spacing = 0.15
    dots_size = 0.2
    dots_spacing = 1

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, 60
    halign = center
    valign = bottom
}

