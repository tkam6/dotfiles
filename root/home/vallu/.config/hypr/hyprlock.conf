# TIME - HOUR
label {
    monitor =
    text = cmd[update:1000] date +"<b>%I</b>" # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    color = rgba(100, 100, 100, 1.0)
    font_size = 360
    font_family = $font_time

    position = 0, 200
    halign = center
    valign = center
}

# TIME - MINUTE
label {
    monitor =
    text = cmd[update:1000] date +"<b>%M</b>"
    color = rgba(100, 0, 0, 1.0)
    font_size = 360
    font_family = $font_time

    position = 0, -200
    halign = center
    valign = center
}

