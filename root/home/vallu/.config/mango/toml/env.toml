#########
##### ENV
#########

[env]

# for Dolphin not showing XDG menu options and not using default applications
"XDG_MENU_PREFIX" = "plasma-"
"XDG_CONFIG_HOME" = "/home/vallu/.config/"
#"AWWW_TRANSITION" = "any"
"AWWW_TRANSITION_STEP" = "3"
"AWWW_TRANSITION_DURATION" = "3"
"AWWW_TRANSITION_FPS" = "120"

# for problems with startup of Java applications
"_JAVA_AWT_WM_NONREPARENTING" = "1"
"AWT_TOOLKIT" = "MToolkit"

# for Qt apps
"QT_QPA_PLATFORM" = "wayland"
"QT_QPA_PLATFORMTHEME" = "qt6ct"
