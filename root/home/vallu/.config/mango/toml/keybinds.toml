"SUPER+n" = "spawn,qs -c noctalia-shell ipc call notifications toggleHistory"
"SUPER+z" = "spawn,qs -c noctalia-shell ipc call network togglePanel"
"SUPER+b" = "spawn,qs -c noctalia-shell ipc call bluetooth togglePanel"
"SUPER+SHIFT+w" = "spawn,qs -c noctalia-shell ipc call wifi toggle"
"SUPER+SHIFT+b" = "spawn,qs -c noctalia-shell ipc call bluetooth toggle"
