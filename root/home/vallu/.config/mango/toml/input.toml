# # # # # # # # # # #
# KEYBOARD SETTINGS #
# # # # # # # # # # #
[global]

repeat_rate = 50
repeat_delay = 250
numlock_on = 1
xkb_rules_layout = us
xkb_rules_variant = altgr-intl


# # # # # # #
# TRACKPAD  #
# # # # # # #
# (needs relogin to apply)

disable_trackpad = 1
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_accel_speed = 0.4
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 1
swipe_min_threshold = 1
trackpad_accel_profile = 1
trackpad_accel_speed = 3.0
trackpad_click_method = 1

# # # # # # # # # #
# MOUSE SETTINGS  #
# # # # # # # # # #
# (needs relogin to apply)

mouse_natural_scrolling = 0
