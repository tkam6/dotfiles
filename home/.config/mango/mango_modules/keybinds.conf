# # # # # # # # #
# KEY BINDINGS  #
# # # # # # # # #

# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# System monitor
bind=CTRL+SHIFT,Escape,spawn,kitty -e btop
bind=CTRL+ALT+SHIFT,Escape,spawn,kitty -e btm

# Layouts
bind=SUPER+SHIFT,k,setlayout,scroller
# bind=SUPER,j,setlayout,tgmix
bind=SUPER+SHIFT,h,setlayout,right_tile
# bind=SUPER+SHIFT,k,switch_layout
bind=SUPER+SHIFT,d,togglejump

# Reload config
# bind=SUPER,p,spawn,~/bin/restart_waybar
bind=SUPER+SHIFT,p,reload_config

# Menu, terminal and other applications
bind=SUPER,r,spawn,rofi -show run
bind=SUPER,t,spawn,rofi -show drun
# bind=SUPER,r,spawn,dmenu_run -i -b -p "$ " -nb '#FFF' -nf '#000' -sb '#107010' -fn 'Iosevka Fixed ExtraBold'
# bind=SUPER,r,spawn,dmenu_extended_run
# bind=SUPER,r,spawn,bemenu-run -b -R 15 -i -p "bemenu" --ch 20 --cw 2 -H 50 -W 0.85 --hp 10 --fn "Iosevka 17" --tb "#111111" --tf "#aaaaaa" --fb "#111111" --ff "#ffffff" --cb "#111111" --cf "#ffffff" --nb "#111111" --nf "#888888" --ab "#111111" --af "#888888" --sb "#ffffff" --sf "#111111" --hb "#111111" --hf "#ffffff"
# bind=SUPER,r,spawn,j4-dmenu-desktop --dmenu="(cat ; (stest -flx $(echo $PATH | tr : ' ') | sort -u)) | bemenu -b -R 15 -i -p 'bemenu' --ch 20 --cw 2 -H 50 -W 0.85 --hp 10 --fn 'Iosevka 17' --tb '#111111' --tf '#aaaaaa' --fb '#111111' --ff '#ffffff' --cb '#111111' --cf '#ffffff' --nb '#111111' --nf '#888888' --ab '#111111' --af '#888888' --sb '#ffffff' --sf '#111111' --hb '#111111' --hf '#ffffff'"
bind=SUPER,q,spawn,alacritty
bind=SUPER,e,spawn,kitty --class yazi -e yazi
bind=SUPER+SHIFT,e,spawn,dolphin

# Logout
bind=CTRL+ALT,Delete,spawn,loginctl terminate-user $(whoami)

# Switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,a,focusdir,left
bind=SUPER,d,focusdir,right
bind=SUPER,w,focusdir,up
bind=SUPER,s,focusdir,down
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Swap windows
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# Switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,backslash,togglefloating,

# Close, maximise, minimise, restore minimised and fullscreen
bind=SUPER,c,killclient,
bind=SUPER,x,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER,y,minimized,
bind=SUPER+SHIFT,y,restore_minimized,

# Scratchpad
bind=SUPER+SHIFT,z,toggle_scratchpad

# Clipboard, notification history, WiFi and Bluetooth
bind=SUPER,v,spawn,kitty --class clipse -e clipse
# bind=SUPER,n,spawn,swaync-client -t -sw
# bind=SUPER+SHIFT,w,spawn,~/.config/mango/scripts/toggle_wifi.sh
# bind=SUPER+SHIFT,b,spawn,bluetoothctl power toggle

# Screen lock and suspend
# bind=SUPER,l,spawn,hyprlock
# bind=SUPER+SHIFT,l,spawn,systemctl suspend

# Screenshot and screen recorder
bind=SUPER,Print,spawn,/home/vallu/.config/mango/scripts/scrshot_clip.sh
bind=NONE,Print,spawn,/home/vallu/.config/mango/scripts/scrshot.sh

# Scroller layout
bind=SUPER,m,switch_proportion_preset,

bind=SUPER+ALT,Left,viewtoleft_have_client,0
bind=SUPER+ALT,Right,viewtoright_have_client,0

# Tag switch by workspace index
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move application to tag and focus
# tagsilent: move client to the tag and not focus it
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor switch
# bind=ALT+SHIFT,Left,focusmon,left
# bind=ALT+SHIFT,Right,focusmon,right
# bind=SUPER+ALT,Left,tagmon,left
# bind=SUPER+ALT,Right,tagmon,right

# Move windows
bind=CTRL+SHIFT+SUPER,Up,movewin,+0,-50
bind=CTRL+SHIFT+SUPER,Down,movewin,+0,+50
bind=CTRL+SHIFT+SUPER,Left,movewin,-50,+0
bind=CTRL+SHIFT+SUPER,Right,movewin,+50,+0

# Resize windows
bind=CTRL+SUPER,Up,resizewin,+0,-50
bind=CTRL+SUPER,Down,resizewin,+0,+50
bind=CTRL+SUPER,Left,resizewin,-50,+0
bind=CTRL+SUPER,Right,resizewin,+50,+0

# Mouse button bindings
# NONE key only works in overview mode
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Axis bindings
# axisbind=SUPER,UP,viewtoleft_have_client
# axisbind=SUPER,DOWN,viewtoright_have_client

# VOLUME KEYS
# Without overdrive
# bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# With overdrive
bind=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bind=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bind=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# BRIGHTNESS KEYS
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e2 --min-value=1000 set 5%-
# PLAYBACK CONTROL KEYS
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioStop,spawn,playerctl stop

