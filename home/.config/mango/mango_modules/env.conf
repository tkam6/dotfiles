# # # #
# ENV #
# # # #

# For Dolphin not showing XDG menu options and not using default applications
env=XDG_MENU_PREFIX,plasma-
env=XDG_CONFIG_HOME,/home/vallu/.config/
# env=XDG_CURRENT_DESKTOP,sway
# env=AWWW_TRANSITION,any
env=AWWW_TRANSITION_STEP,3
env=AWWW_TRANSITION_DURATION,3
env=AWWW_TRANSITION_FPS,120

# Dank Material Shell
env=QT_QPA_PLATFORM,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=QT_QPA_PLATFORMTHEME,gtk3

# For problems with startup of Java applications
env=_JAVA_AWT_WM_NONREPARENTING,1
env=AWT_TOOLKIT,MToolkit

# For Qt apps
env=QT_QPA_PLATFORMTHEME,qt6ct
